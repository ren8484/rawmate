name: Windows test build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile RAWMate-Test.exe
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Cannot find .NET Framework compiler: $compiler"
          }
          & $compiler /nologo /target:winexe /optimize+ /out:RAWMate-Test.exe /win32icon:RAWMate.ico /resource:RAWMateHeader.png,RAWMateHeader.png RAWMate.cs "/reference:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\WPF\WindowsBase.dll" "/reference:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationCore.dll" "/reference:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\WPF\PresentationFramework.dll" "/reference:$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\System.Xaml.dll" /reference:System.Windows.Forms.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash .\RAWMate-Test.exe -Algorithm SHA256

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: RAWMate-Test
          path: RAWMate-Test.exe
          if-no-files-found: error
